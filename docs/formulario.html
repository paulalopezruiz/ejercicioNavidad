<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navidad - Confirmar asistencia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body class="bg-light d-flex flex-column min-vh-100"
      style="background: url('fondoformulario.jpg') center/cover no-repeat fixed;">

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🎄 Navidad</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
                <li class="nav-item"><a class="nav-link active" href="formulario.html">Confirmar</a></li>
            </ul>
        </div>
    </div>
</nav>


<main class="flex-grow-1 d-flex align-items-center py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="fw-bold">Confirmar asistencia</h1>
                            <p class="text-muted mb-0">Rellena el formulario para organizarnos</p>
                        </div>

                        <form>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="nombre">Nombre</label>
                                    <input class="form-control" id="nombre" type="text" placeholder="Tu nombre" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="email">Email</label>
                                    <input class="form-control" id="email" type="email" placeholder="tu@email.com" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="asistencia">¿Vienes?</label>
                                    <select class="form-select" id="asistencia" required>
                                        <option value="" selected disabled>Elige una opción</option>
                                        <option>Sí</option>
                                        <option>No</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="acompanantes">Acompañantes</label>
                                    <input class="form-control" id="acompanantes" type="number" min="1" max="10" value="1">
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Preferencias</label>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="veg">
                                            <label class="form-check-label" for="veg">Vegetariano</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="gluten">
                                            <label class="form-check-label" for="gluten">Sin gluten</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="alergias">
                                            <label class="form-check-label" for="alergias">Tengo alergias</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="comentarios">Comentarios</label>
                                    <textarea class="form-control" id="comentarios" rows="3"
                                              placeholder="Alergias, intolerancias o cualquier detalle..."></textarea>
                                </div>

                                <div class="col-12 d-flex gap-2">
                                    <button class="btn btn-danger" type="submit">Enviar</button>
                                    <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
                                    <a href="index.html" class="btn btn-link ms-auto">Volver</a>
                                </div>

                                <p class="text-muted small mb-0">
                                    Cualquier duda llámanos a: 680 099 928
                                </p>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
